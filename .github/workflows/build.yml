name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip DominoApp
        run: |
          mkdir -p website
          unzip -o DominoApp.zip -d website/
          cd website
          # نقل الملفات من المجلدات الفرعية إذا وجدت
          if [ -d "www" ]; then
            cp -r www/* ./
          fi
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create domino com.domino.app "دومينو"
          cd domino
          cp -r ../website/* www/
          cordova platform add android
          cordova build android --release
          # البحث عن APK
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: ./*.apk
