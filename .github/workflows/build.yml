name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip DominoApp
        run: |
          mkdir -p website
          unzip -o DominoApp.zip -d website/
          cd website
          if [ -d "www" ]; then
            cp -r www/* ./
          fi
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create domino com.domino.app "دومينو"
          cd domino
          cp -r ../website/* www/
          cordova platform add android
          cordova build android --release -- --packageType=apk

      - name: Sign APK with debug keystore
        run: |
          # استخدام jarsigner لتوقيع APK
          find . -name "*.apk" -exec cp {} ./app-to-sign.apk \;
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore website/debug.keystore -storepass android -keypass android app-to-sign.apk androiddebugkey
          mv app-to-sign.apk DominoApp-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: DominoApp-signed.apk
