name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip DominoApp
        run: |
          mkdir -p website
          unzip -o DominoApp.zip -d website/
          cd website
          if [ -d "www" ]; then
            cp -r www/* ./
          fi
          ls -la

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova APK
        run: |
          cordova create domino com.domino.app "دومينو"
          cd domino
          cp -r ../website/* www/
          cordova platform add android
          # الحل السحري: الأمر التالي يجبر Cordova على إنتاج APK وليس AAB
          cordova build android --release -- --packageType=apk
          
          # البحث عن APK في جميع المواقع المحتملة
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Find and Upload APK
        id: find-apk
        run: |
          apk_file=$(find . -name "*.apk" | head -1)
          if [ -z "$apk_file" ]; then
            echo "::error::No APK file found"
            exit 1
          fi
          echo "APK_PATH=$apk_file" >> $GITHUB_OUTPUT
          echo "Found APK at: $apk_file"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: ${{ steps.find-apk.outputs.APK_PATH }}
