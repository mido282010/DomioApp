name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip files
      run: |
        mkdir -p app/www
        unzip -o DominoApp.zip -d app/www/
        ls -la app/www/

    - name: Create Android Project
      run: |
        mkdir -p android_project/app/src/main/assets/www
        cp -r app/www/www/* android_project/app/src/main/assets/www/ 2>/dev/null || cp -r app/www/* android_project/app/src/main/assets/www/
        
        # إضافة مجلد الصور
        if [ -d "app/www/img" ]; then
          cp -r app/www/img android_project/app/src/main/assets/
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build APK with cordova
      run: |
        npm install -g cordova
        cordova create domino com.domino.app "دومينو"
        cd domino
        cp -r ../android_project/app/src/main/assets/www www/
        cordova platform add android
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DominoApp
        path: domino/platforms/android/app/build/outputs/apk/release/*.apk
