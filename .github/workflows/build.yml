name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract files
        run: |
          unzip -o DominoApp.zip -d extracted/
          mkdir -p website
          cp -r extracted/DominoApp/www/* website/
          cp -r extracted/DominoApp/img website/ 2>/dev/null || true
          
          # إنشاء ملف index.html رئيسي
          cat > website/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
          <body>
          <script>
            window.location.href = "www/index.html";
          </script>
          </body>
          </html>
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Download APK Builder
        run: |
          wget https://github.com/ashiqursuper/WebViewAPKBuilder/releases/download/v1.0/WebViewAPKBuilder.jar
          
          # إنشاء ملف التكوين
          cat > config.properties << 'EOF'
          app.name=دومينو
          app.package=com.domino.app
          website.folder=website
          icon.path=extracted/DominoApp/ic_launcher.png
          keystore.path=extracted/DominoApp/debug.keystore
          keystore.password=Domino2024
          keystore.alias=androiddebugkey
          EOF

      - name: Build APK
        run: |
          java -jar WebViewAPKBuilder.jar config.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: output/*.apk
