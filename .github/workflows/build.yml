name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract files
        run: |
          unzip -o DominoApp.zip -d extracted/
          ls -la extracted/
          ls -la extracted/www/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK
        run: |
          cordova create domino com.domino.app "دومينو"
          cd domino
          cp -r ../extracted/www/* www/
          cp -r ../extracted/img www/ 2>/dev/null || true
          cordova platform add android
          cordova build android --release -- --packageType=apk
          cp platforms/android/app/build/outputs/apk/release/*.apk ../app-unsigned.apk

      - name: Sign APK
        run: |
          # استخدام debug.keystore من المجلد المستخرج
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore extracted/debug.keystore -storepass android -keypass android app-unsigned.apk androiddebugkey
          mv app-unsigned.apk DominoApp-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: DominoApp-signed.apk
