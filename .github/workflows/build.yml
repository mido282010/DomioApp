name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract files
        run: |
          unzip -o DominoApp.zip -d extracted/
          mkdir -p website
          cp -r extracted/DominoApp/www/* website/
          cp -r extracted/DominoApp/img website/ 2>/dev/null || true
          ls -la website/

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '9.0'

      - name: Install Cordova
        run: npm install -g cordova@10.0.0

      - name: Build APK
        run: |
          cordova create domino com.domino.app "دومينو"
          cd domino
          rm -rf www/*
          cp -r ../website/* www/
          cordova platform add android@10.1.2
          cordova build android --release

      - name: Sign APK
        run: |
          cd domino
          # إنشاء keystore
          keytool -genkey -v -keystore mykeystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias myalias -dname "CN=Domino, OU=Dev, O=DominoApp, L=Cairo, ST=Cairo, C=EG" -storepass Domino2024 -keypass Domino2024
          
          # توقيع APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore mykeystore.jks -storepass Domino2024 -keypass Domino2024 platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk myalias
          
          # نسخ الملف
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../DominoApp-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: DominoApp-signed.apk
