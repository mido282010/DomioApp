name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip files
      run: |
        mkdir -p app/www
        unzip -o DominoApp.zip -d app/www/
        ls -la app/www/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: |
        npm install -g cordova
        npm install -g cordova-android@latest

    - name: Create Cordova Project
      run: |
        cordova create domino com.domino.app "دومينو"
        cd domino
        
        # نسخ الملفات
        if [ -d "../app/www/www" ]; then
          cp -r ../app/www/www/* www/
        else
          cp -r ../app/www/* www/
        fi
        
        # نسخ مجلد الصور
        if [ -d "../app/www/img" ]; then
          cp -r ../app/www/img www/
        fi
        
        # إضافة Android platform
        cordova platform add android@latest
        cordova plugin add cordova-plugin-whitelist

    - name: Build APK
      run: |
        cd domino
        cordova build android --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DominoApp
        path: domino/platforms/android/app/build/outputs/apk/**/*.apk
