name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip files
      run: |
        mkdir -p html_files
        unzip -o DominoApp.zip -d html_files/
        ls -la html_files/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create APK using Pwabuilder
      run: |
        # تثبيت الأدوات
        sudo apt-get update
        sudo apt-get install -y wget unzip
        
        # تحميل Pwabuilder CLI
        npm install -g @pwabuilder/cli
        
        # إنشاء PWA من مجلد HTML
        mkdir pwa
        cp -r html_files/* pwa/
        
        cd pwa
        pwabuilder package
        
        # البحث عن APK
        find . -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DominoApp
        path: pwa/**/*.apk
