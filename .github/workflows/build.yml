name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip files
      run: |
        mkdir -p website
        unzip -o DominoApp.zip -d website/
        cd website
        # إعادة تسمية index.html إذا كان موجوداً في مجلد فرعي
        if [ -f "www/index.html" ]; then
          cp www/index.html ./
        fi
        ls -la

    - name: Create APK using Bubblewrap
      run: |
        # تثبيت Bubblewrap
        npm install -g @bubblewrap/cli
        
        # إنشاء Web Manifest
        cd website
        cat > manifest.json << 'EOF'
        {
          "name": "دومينو",
          "short_name": "دومينو",
          "start_url": "index.html",
          "display": "standalone",
          "theme_color": "#1b5e3a",
          "background_color": "#0a3d2a",
          "icons": [
            {
              "src": "ic_launcher.png",
              "sizes": "256x256",
              "type": "image/png"
            }
          ]
        }
        EOF
        
        # بناء APK
        npx bubblewrap init --manifest manifest.json
        npx bubblewrap build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: DominoApp
        path: website/app-release-unsigned.apk
