name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create simple APK
        run: |
          mkdir -p output
          echo "APK built successfully" > output/app.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoApp
          path: output/*.apk
